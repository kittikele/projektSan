<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanrio karakterkezelő</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div class="container py-4">
        <h1 class="text-center mb-4">♡ Sanrio karakterkezelő ♡</h1>
        <div id="authSection" class="row g-3 mb-3">
            <div class="col-12 col-md-6">
                <div class="auth-box">
                    <h3>Regisztráció</h3>
                    <form id="registerForm">
                        <input class="form-control mb-2" type="text" id="regUsername" placeholder="Felhasználónév" required>
                        <input class="form-control mb-2" type="email" id="regEmail" placeholder="E-mail cím" required>
                        <input class="form-control mb-2" type="password" id="regPassword" placeholder="Jelszó" required>
                        <button class="btn btn-pink w-100" type="submit">Regisztráció</button>
                    </form>
                </div>
            </div>
            <div class="col-12 col-md-6">
                <div class="auth-box">
                    <h3>Bejelentkezés</h3>
                    <form id="loginForm">
                        <input class="form-control mb-2" type="email" id="loginEmail" placeholder="E-mail cím" required>
                        <input class="form-control mb-2" type="password" id="loginPassword" placeholder="Jelszó" required>
                        <button class="btn btn-pink w-100" type="submit">Bejelentkezés</button>
                    </form>
                </div>
            </div>
        </div>
        <div id="message"></div>
        <div id="userSection" hidden>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 id="welcome"></h2>
                <button id="logoutButton" class="btn btn-outline-secondary" type="button">Kijelentkezés</button>
            </div>
            <h3 class="mb-3">Saját karaktereim</h3>
            <div id="userCharacters" class="row g-3 mb-5"></div>
            <div class="auth-box mb-5">
                <h3>Új karakter hozzáadása</h3>
                <form id="characterForm">
                    <div class="row g-2">
                        <div class="col-12 col-md-6"><input class="form-control" id="characterName" placeholder="Karakter neve" required></div>
                        <div class="col-12 col-md-6"><input class="form-control" id="realName" placeholder="Igazi neve" required></div>
                        <div class="col-12 col-md-6"><input class="form-control" id="birthday" placeholder="Születésnap" required></div>
                        <div class="col-12 col-md-6"><input class="form-control" id="species" placeholder="Faj" required></div>
                        <div class="col-12 col-md-6"><select class="form-select" id="gender" required>
                            <option value="">Nem</option>
                            <option value="F">Nő</option>
                            <option value="M">Férfi</option>
                            <option value="G">Nemtelen</option>
                        </select></div>
                        <div class="col-12 col-md-6"><input class="form-control" id="breed" placeholder="Fajta" required></div>
                        <div class="col-12 col-md-6"><input class="form-control" id="image" type="url" placeholder="Kép URL-je"></div>
                        <div class="col-12 col-md-6"><select id="isPublic" class="form-select">
                            <option value="1">Publikus</option>
                            <option value="0">Privát</option>
                        </select></div>
                        <div class="col-12"><button class="btn btn-pink" type="submit">Karakter mentése</button></div>
                    </div>
                </form>
            </div>
        </div>
        <h2 class="mb-3">Publikus karakterek</h2>
        <div id="publicCharacters" class="row g-3"></div>
    </div>
</body>
</html>
